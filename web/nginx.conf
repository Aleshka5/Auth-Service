server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every resume node is a client-side path, so unknown URLs fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes everything under /assets, so it can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Self-hosted faces are not hashed — cache them hard, but not forever.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
