<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="512" height="512" viewBox="0 0 512 512" style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd">
<style type="text/css"><![CDATA[
  .wing, .eye {
    transform-box: view-box;
    animation-duration: 1.25s;
    animation-iteration-count: 1;
    animation-fill-mode: both;
  }
  .wing-left {
    transform-origin: 144.83px 389.97px;
    animation-name: spread-left;
  }
  .wing-right {
    transform-origin: 372.90px 390.27px;
    animation-name: spread-right;
  }
  .eye-left { transform-origin: 211.64574px 127.50473px; animation-name: open-eyes; }
  .eye-right { transform-origin: 307.4032px 127.48424px; animation-name: open-eyes; }
  @keyframes spread-left {
    0%, 6% { transform: translate(9.685px, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.2, 0.75, 0.25, 1); }
    46% { transform: translate(9.685px, 0) rotate(-6deg); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes spread-right {
    0%, 6% { transform: translate(-9.245px, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.2, 0.75, 0.25, 1); }
    46% { transform: translate(-9.245px, 0) rotate(6deg); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes open-eyes {
    0%, 42% { transform: scaleY(0); opacity: 0; animation-timing-function: cubic-bezier(0.2, 0.85, 0.3, 1); }
    100% { transform: scaleY(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wing, .eye { animation: none; }
    .wing-left, .wing-right { transform: none; }
    .eye { transform: none; opacity: 1; }
  }
]]></style>
