# Auth Gateway routing. Adding a host is a config change, not a code change.
# First matching route wins — put more specific prefixes before catch-alls.
# See docs/auth-gateway.md.

listen: ":8083"
public_origin: "https://filenkov.store"

timeouts:
  read_header: 15s
  idle: 120s
  proxy: 60s          # default (hub / others); per-host override is timeouts.proxy under the host

rate_limit:
  requests_per_minute: 180

upstreams:
  api: "http://api:8000"
  web: "http://web:80"
  user_service: "http://user_service:8000"
  # Hermes container on auth_network (hermes-auth-gateway/docker-compose.yml).
  hermes: "http://hermes:8787"
  # WebStorage joins auth_network as compose service `app` (external network from that stack).
  storage: "http://app:8000"
  # HomeMessanger joins auth_network as compose service `messanger` (external network from that stack).
  messanger: "http://messanger:8000"
  # Qwen Image container `qwen-image` on qwen_image_gen_network (external; that stack creates the network).
  qwen_image: "http://qwen-image:8000"
  # llama.cpp server container `qwen38` on llm_network (one-off; not in this compose).
  qwen38: "http://qwen38:4001"
  # RAG-Chat edge container `rag-edge` on rag_edge (external; the RAG-Chat stack creates the network).
  rag: "http://rag-edge:8080"

hosts:
  filenkov.store:
    role_field: global_role
    # Local HTTP via Caddy on :80: add [localhost]
    aliases: []
    routes:
      - match: /oauth/*
        upstream: api
        auth: public
      # The owl chat greets anonymous readers, so it cannot require a session.
      # Signed-in visitors still arrive with the injected X-Auth-* headers.
      - match: /api/chat
        methods: [POST]
        upstream: api
        auth: public
      - match: /api/refresh
        upstream: api
        auth: public
      - match: /api/logout
        upstream: api
        auth: public
      - match: /api/me
        upstream: api
        auth: session
      - match: /api/*
        upstream: api
        auth: session
      - match: /users/by-google-sub/*
        auth: reject
      - match: /users/by-email/*
        auth: reject              # service-to-service lookup on user_network only
      - match: /users
        methods: [POST]
        auth: reject              # create is Auth API on user_network only
      - match: /users
        methods: [GET]
        upstream: user_service
        auth: admin               # directory list — hub ADMIN only
        preserve_host: false
      - match: /users/*
        upstream: user_service
        auth: session
        preserve_host: false
      - match: /health
        upstream: api
        auth: public
      # Any signed-in user: docs/hermes.md. JWT plugin verifies injected Bearer.
      - match: /hermes
        upstream: hermes
        auth: session
        strip_prefix: /hermes
        inject_access_jwt: true
      - match: /hermes/login
        methods: [GET]
        auth: session
        redirect: /hermes/sessions
      - match: /hermes/*
        upstream: hermes
        auth: session
        strip_prefix: /hermes
        inject_access_jwt: true
      - match: /chat
        methods: [GET]
        auth: session
        redirect: /hermes/chat
      - match: /sessions
        methods: [GET]
        auth: session
        redirect: /hermes/sessions
      - match: /admin
        upstream: web
        auth: admin
      - match: /admin/*
        upstream: web
        auth: admin
      - match: /*
        upstream: web
        auth: public

  storage.filenkov.store:
    role_field: storage
    # Uploads need a long reverse-proxy response-header timeout (does not cap the request body).
    timeouts:
      proxy: 30m
    routes:
      - match: /health
        upstream: storage
        auth: public
      - match: /*
        upstream: storage
        auth: session

  messanger.filenkov.store:
    role_field: global_role
    # Attachment uploads need a generous response-header timeout (it does not cap the request body).
    timeouts:
      proxy: 5m
    routes:
      # First match wins, so /health must precede the catch-all.
      - match: /health
        upstream: messanger
        auth: public
      # The catch-all serves both /api/* and the SPA.
      - match: /*
        upstream: messanger
        auth: session

  image.filenkov.store:
    # Non-public routes need User-Service `image` role FAMILY or ADMIN; anyone else gets 403.
    role_field: image
    # A generate can take minutes before the first response byte (response-header timeout).
    timeouts:
      proxy: 30m
    routes:
      # The app's own health, public. First match wins, so /healthz must precede the catch-all.
      - match: /healthz
        upstream: qwen_image
        auth: public
      # The catch-all serves both the UI and POST /api/generate.
      - match: /*
        upstream: qwen_image
        auth: session

  llm.filenkov.store:
    role_field: global_role
    # Chat completions may wait a long time before the first response byte.
    timeouts:
      proxy: 10m
    routes:
      - match: /*
        upstream: qwen38
        auth: admin

  rag.filenkov.store:
    role_field: global_role
    # PDF uploads and chat-to-first-streaming-byte need a response-header timeout.
    timeouts:
      proxy: 5m
    routes:
      # First match wins, so /health must precede the catch-all.
      - match: /health
        upstream: rag
        auth: public
      # The catch-all serves the frontend, /api/files and /api/chats.
      - match: /*
        upstream: rag
        auth: session
