# Auth Gateway routing. Adding a host is a config change, not a code change.
# First matching route wins — put more specific prefixes before catch-alls.
# See docs/auth-gateway.md.

listen: ":8083"
public_origin: "https://filenkov.store"

timeouts:
  read_header: 15s
  idle: 120s
  proxy: 60s          # default (hub / others); per-host override is timeouts.proxy under the host

rate_limit:
  requests_per_minute: 180

upstreams:
  api: "http://api:8000"
  web: "http://web:80"
  user_service: "http://user_service:8000"
  # WebStorage joins auth_network as compose service `app` (external network from that stack).
  storage: "http://app:8000"
  # Qwen Image container `qwen-image`, owned by Switch-Service on models_network.
  qwen_image: "http://qwen-image:8000"
  # llama.cpp server container `qwen38`, owned by Switch-Service on models_network.
  qwen38: "http://qwen38:4001"
  # RAG-Chat edge container `rag-edge` on rag_edge (external; the RAG-Chat stack creates the network).
  rag: "http://rag-edge:8080"
  # Switch-Service control plane for the model containers. It runs on the host
  # (it needs nvidia-smi and the rootless podman socket), and rootless podman
  # exposes the host to containers as host.docker.internal.
  switch: "http://host.docker.internal:8095"

hosts:
  filenkov.store:
    role_field: global_role
    # Local HTTP via Caddy on :80: add [localhost]
    aliases: []
    routes:
      - match: /oauth/*
        upstream: api
        auth: public
      # The owl chat greets anonymous readers, so it cannot require a session.
      # Signed-in visitors still arrive with the injected X-Auth-* headers.
      - match: /api/chat
        methods: [POST]
        upstream: api
        auth: public
      - match: /api/refresh
        upstream: api
        auth: public
      - match: /api/logout
        upstream: api
        auth: public
      # Model service control (off / cpu / gpu) for the hub admin page. The
      # routes must precede /api/*, which is session-scoped. X-Service-Token is
      # the shared secret from .env: the browser never sees it and cannot
      # override it, because the config value wins over the client header.
      - match: /api/services
        upstream: switch
        auth: admin
        headers:
          X-Service-Token: "${SWITCH_TOKEN}"
      - match: /api/services/*
        upstream: switch
        auth: admin
        headers:
          X-Service-Token: "${SWITCH_TOKEN}"
      - match: /api/me
        upstream: api
        auth: session
      - match: /api/*
        upstream: api
        auth: session
      - match: /users/by-google-sub/*
        auth: reject
      - match: /users/by-email/*
        auth: reject              # service-to-service lookup on user_network only
      - match: /users
        methods: [POST]
        auth: reject              # create is Auth API on user_network only
      - match: /users
        methods: [GET]
        upstream: user_service
        auth: admin               # directory list — hub ADMIN only
        preserve_host: false
      - match: /users/*
        upstream: user_service
        auth: session
        preserve_host: false
      - match: /health
        upstream: api
        auth: public
      # Signed-in dashboard moved to its own host (https://hermes.filenkov.store); the
      # /hermes/* mount and the /chat, /sessions redirects were removed. Everything under
      # /* now reaches the hub SPA instead of a dead upstream.
      - match: /admin
        upstream: web
        auth: admin
      - match: /admin/*
        upstream: web
        auth: admin
      - match: /*
        upstream: web
        auth: public

  storage.filenkov.store:
    role_field: storage
    # Uploads need a long reverse-proxy response-header timeout (does not cap the request body).
    timeouts:
      proxy: 30m
    routes:
      - match: /health
        upstream: storage
        auth: public
      - match: /*
        upstream: storage
        auth: session

  image.filenkov.store:
    # Non-public routes need User-Service `image` role FAMILY or ADMIN; anyone else gets 403.
    role_field: image
    # A generate can take minutes before the first response byte (response-header timeout).
    timeouts:
      proxy: 30m
    routes:
      # The app's own health, public. First match wins, so /healthz must precede the catch-all.
      - match: /healthz
        upstream: qwen_image
        auth: public
      # The catch-all serves both the UI and POST /api/generate.
      - match: /*
        upstream: qwen_image
        auth: session

  llm.filenkov.store:
    role_field: global_role
    # Chat completions may wait a long time before the first response byte.
    timeouts:
      proxy: 10m
    routes:
      - match: /*
        upstream: qwen38
        auth: admin

  rag.filenkov.store:
    role_field: global_role
    # PDF uploads and chat-to-first-streaming-byte need a response-header timeout.
    timeouts:
      proxy: 5m
    routes:
      # First match wins, so /health must precede the catch-all.
      - match: /health
        upstream: rag
        auth: public
      # The catch-all serves the frontend, /api/files and /api/chats.
      - match: /*
        upstream: rag
        auth: session
