# Auth Gateway routing. Adding a host is a config change, not a code change.
# First matching route wins — put more specific prefixes before catch-alls.
# See docs/auth-gateway.md.

listen: ":8083"
public_origin: "https://filenkov.store"

timeouts:
  read_header: 15s
  idle: 120s
  proxy: 60s          # default (hub / others); per-host override is timeouts.proxy under the host

rate_limit:
  requests_per_minute: 180

upstreams:
  api: "http://api:8000"
  web: "http://web:80"
  user_service: "http://user_service:8000"
  # WebStorage joins auth_network as compose service `app` (external network from that stack).
  storage: "http://app:8000"
  # Qwen Image container `qwen-image`, owned by Switch-Service on models_network.
  qwen_image: "http://qwen-image:8000"
  # llama.cpp server container `qwen38`, owned by Switch-Service on models_network.
  qwen38: "http://qwen38:4001"
  # RAG-Chat edge container `rag-edge` on rag_edge (external; the RAG-Chat stack creates the network).
  rag: "http://rag-edge:8080"
  # Observability: Grafana container on common_network (~/projects/Common/observability).
  grafana: "http://grafana:3000"
  # audio.filenkov.store: the `audio-api` container of the ASR stack
  # (~/projects/ASR-Service, compose project `audio`) on auth_network (deploy_auth_network).
  audio: "http://audio-api:8000"
  # The SPA of the same stack: nginx, compose service `frontend`. It serves static files
  # only (frontend/nginx.conf), so every `/api/*` request must go to `audio`, not here.
  audio_web: "http://frontend:80"
  # Switch-Service control plane for the model containers. It runs on the host
  # (it needs nvidia-smi and the rootless podman socket).
  #
  # The address is the host's LAN IP, not host.docker.internal. On this host the
  # `extra_hosts: host.docker.internal:host-gateway` entry resolves to
  # 169.254.1.2 and that address is black-holed under rootless podman 5.7 with
  # netavark: from inside this container `nc -z -w 3 169.254.1.2 8095` times out
  # (wget waits out its own timeout), while 192.168.1.102:8095 answers 200. The
  # control plane binds 0.0.0.0, so the LAN IP is the only path that works —
  # masquerade makes the container's source address 192.168.1.102 on arrival,
  # which is also why the host firewall allows dport 8095 from the host's own
  # address only (see the switch.service unit). The address is DHCP-reserved on
  # the ZTE F680; change it here if the host moves.
  switch: "http://192.168.1.102:8095"
  # Jitsi Meet frontend (~/projects/Jitsi-Meet, podman-compose). The container is
  # aliased `jitsi-web` on deploy_auth_network because the bare name `web` already
  # belongs to the hub SPA. Inside the image nginx listens on 8000 (not 80): TLS is
  # terminated here at Caddy, so the container runs with DISABLE_HTTPS=1.
  # Its nginx also proxies /xmpp-websocket → prosody and /colibri-ws → jvb, so this
  # one upstream covers the UI, signaling and data channels.
  jitsi_web: "http://jitsi-web:8000"

hosts:
  filenkov.store:
    role_field: global_role
    # Local HTTP via Caddy on :80: add [localhost]
    aliases: []
    routes:
      - match: /oauth/*
        upstream: api
        auth: public
      # The owl chat greets anonymous readers, so it cannot require a session.
      # Signed-in visitors still arrive with the injected X-Auth-* headers.
      - match: /api/chat
        methods: [POST]
        upstream: api
        auth: public
      - match: /api/refresh
        upstream: api
        auth: public
      - match: /api/logout
        upstream: api
        auth: public
      # Model service control (off / cpu / gpu). These routes must precede
      # /api/*, which is session-scoped. X-Service-Token is the shared secret
      # from .env: the browser never sees it and cannot override it, because
      # the config value wins over the client header.
      # GET is session so the hub header can ask whether image and llm are
      # ready. Image is granted by the image role, which is not hub ADMIN, so
      # an admin-only read would hide that link from everyone allowed to use it.
      # Switching a service stays admin, on the exact path and on /api/services/*.
      - match: /api/services
        methods: [GET]
        upstream: switch
        auth: session
        headers:
          X-Service-Token: "${SWITCH_TOKEN}"
      - match: /api/services
        upstream: switch
        auth: admin
        headers:
          X-Service-Token: "${SWITCH_TOKEN}"
      - match: /api/services/*
        upstream: switch
        auth: admin
        headers:
          X-Service-Token: "${SWITCH_TOKEN}"
      - match: /api/me
        upstream: api
        auth: session
      - match: /api/*
        upstream: api
        auth: session
      - match: /users/by-google-sub/*
        auth: reject
      - match: /users/by-email/*
        auth: reject              # service-to-service lookup on user_network only
      - match: /users
        methods: [POST]
        auth: reject              # create is Auth API on user_network only
      - match: /users
        methods: [GET]
        upstream: user_service
        auth: admin               # directory list — hub ADMIN only
        preserve_host: false
      - match: /users/*
        upstream: user_service
        auth: session
        preserve_host: false
      - match: /health
        upstream: api
        auth: public
      # Signed-in dashboard moved to its own host (https://hermes.filenkov.store); the
      # /hermes/* mount and the /chat, /sessions redirects were removed. Everything under
      # /* now reaches the hub SPA instead of a dead upstream.
      - match: /admin
        upstream: web
        auth: admin
      - match: /admin/*
        upstream: web
        auth: admin
      - match: /*
        upstream: web
        auth: public

  storage.filenkov.store:
    role_field: storage
    # Uploads need a long reverse-proxy response-header timeout (does not cap the request body).
    timeouts:
      proxy: 30m
    routes:
      - match: /health
        upstream: storage
        auth: public
      - match: /*
        upstream: storage
        auth: session

  image.filenkov.store:
    # Non-public routes need User-Service `image` role FAMILY or ADMIN; anyone else gets 403.
    role_field: image
    # A generate can take minutes before the first response byte (response-header timeout).
    timeouts:
      proxy: 30m
    routes:
      # The app's own health, public. First match wins, so /healthz must precede the catch-all.
      - match: /healthz
        upstream: qwen_image
        auth: public
      # The catch-all serves both the UI and POST /api/generate.
      - match: /*
        upstream: qwen_image
        auth: session

  llm.filenkov.store:
    role_field: global_role
    # Chat completions may wait a long time before the first response byte.
    timeouts:
      proxy: 10m
    routes:
      - match: /*
        upstream: qwen38
        auth: admin

  rag.filenkov.store:
    role_field: global_role
    # PDF uploads and chat-to-first-streaming-byte need a response-header timeout.
    timeouts:
      proxy: 5m
    routes:
      # First match wins, so /health must precede the catch-all.
      - match: /health
        upstream: rag
        auth: public
      # The catch-all serves the frontend, /api/files and /api/chats.
      - match: /*
        upstream: rag
        auth: session

  # audio.filenkov.store — ASR stack (~/projects/ASR-Service). Product role is the
  # `global_role` hub: open to anyone signed in, no per-service role.
  # Verified fragment: ~/projects/ASR-Service/deploy/gateway.yaml (`make gateway`).
  audio.filenkov.store:
    role_field: global_role
    # The only host allowed to use the microphone: the record button calls
    # getUserMedia(). The gateway stamps its own Permissions-Policy on every response,
    # and the browser intersects duplicate policies, so without this override the Caddy
    # block's microphone=(self) would be cancelled by the gateway's microphone=().
    permissions_policy: "camera=(), microphone=(self), geolocation=()"
    # A file upload answers only after the body is accepted; diarization takes minutes.
    # This is a ResponseHeaderTimeout, not the lifetime limit of a voice-note socket.
    timeouts:
      proxy: 30m
    routes:
      # First match wins: /health must precede /api/*, and /api/* must precede /*.
      # Public — an uptime check needs no cookie.
      - match: /health
        upstream: audio
        auth: public
      # The API and the voice-note socket (`/api/voice-notes/{id}/stream`) live in audio-api.
      # Only with a session; the gateway answers 401 JSON, not 302.
      - match: /api/*
        upstream: audio
        auth: session
      # Everything else is the SPA: nginx answers index.html for any path (client-side
      # routing). Before this route existed the UI host returned audio-api's
      # `{"detail":"Not Found"}` for `/` (verified on the stand 2026-11-01).
      - match: /*
        upstream: audio_web
        auth: session

  # Observability: Grafana (Prometheus UI is not exposed — localhost only).
  # Same Google gate as every other product host, and Grafana keeps its own login
  # on top (anonymous access is off), so the dashboards are behind two gates.
  observer.filenkov.store:
    role_field: global_role
    # Wide dashboard ranges hit the HDD-backed TSDB; the default 60s would cut them.
    timeouts:
      proxy: 5m
    routes:
      # Grafana's own health endpoint, public so uptime checks do not need a session.
      # First match wins, so it must precede the catch-all.
      - match: /api/health
        upstream: grafana
        auth: public
      # Login page, assets, /api/* and the Live WebSocket all take this path.
      - match: /*
        upstream: grafana
        auth: session

  # meet.filenkov.store — Jitsi Meet (~/projects/Jitsi-Meet, podman-compose).
  # LAN + WireGuard only: the name is only in /etc/hosts (dnsmasq), and Caddy pins
  # the site to 10.10.0.0/24 + 192.168.1.0/24 as a second layer. Media never passes
  # this gateway — it is UDP straight to jvb, which advertises 192.168.1.102 and
  # 10.10.0.1, so there is no port forward and no internet access.
  meet.filenkov.store:
    role_field: global_role
    # Jitsi calls getUserMedia() and getDisplayMedia(). The strict default
    # (camera=(), microphone=()) would block the camera, the microphone and screen
    # sharing, and the browser intersects this header with Caddy's copy.
    permissions_policy: "camera=(self), microphone=(self), display-capture=(self), geolocation=()"
    # Long-lived WebSockets: /xmpp-websocket (signaling) and /colibri-ws/*
    # (data channels). `proxy` is a response-header wait, kept generous for joins.
    timeouts:
      proxy: 5m
    routes:
      # Single upstream: the web container's nginx serves the app, /config.js,
      # the WebSocket proxies and /http-bind. First match wins — nothing else needed.
      - match: /*
        upstream: jitsi_web
        auth: session

