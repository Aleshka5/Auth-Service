# Start the User-Service stack first so external user_network and
# hostname user_service exist. Auth does not create User-Service.
# Start the LiteLLM stack so external llm_network and hostname
# litellm-proxy-server exist before this compose.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: rejected_cache
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - auth_network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: resume_web
    restart: unless-stopped
    networks:
      - auth_network

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: resume_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      HTTP_ADDR: ":8000"
      REDIS_URL: redis://redis:6379/0
      USER_SERVICE_URL: http://user_service:8000
      GATEWAY_CONFIG: /etc/auth/gateway.yaml
      # Owl chat. LLM_API_KEY and LLM_MODEL come from ../.env.
      LLM_HOST: ${LLM_HOST}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT}
    volumes:
      - ./gateway.yaml:/etc/auth/gateway.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - auth_network
      - user_network
      # The owl chat calls litellm-proxy-server directly, not through the edge.
      - llm_network

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: gateway
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GATEWAY_HTTP_ADDR: ":8083"
      USER_SERVICE_URL: http://user_service:8000
      GATEWAY_CONFIG: /etc/auth/gateway.yaml
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./gateway.yaml:/etc/auth/gateway.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - auth_network
      - user_network
      - llm_network

networks:
  auth_network:
    driver: bridge
  user_network:
    external: true
  llm_network:
    external: true
