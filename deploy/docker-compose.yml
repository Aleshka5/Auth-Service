# Start the User-Service stack first so external user_network and
# hostname user_service exist. Auth does not create User-Service.
# Start the LiteLLM stack so external llm_network and hostname
# litellm-proxy-server exist before this compose (owl chat).
# The one-off llama.cpp container qwen38 must already be on that network
# so the gateway can reach http://qwen38:4001. Do not add qwen38 here.
# Start the image stack so external qwen_image_gen_network and hostname
# qwen-image exist. The network must exist for the gateway to start
# (`podman network create qwen_image_gen_network` is enough); a stopped
# qwen-image then fails only image.filenkov.store.
# Start the RAG-Chat stack so external rag_edge and hostname rag-edge
# exist. As with the image network, the network must exist for the
# gateway to start; a stopped rag-edge then fails only rag.filenkov.store.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: rejected_cache
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - auth_network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: resume_web
    restart: unless-stopped
    networks:
      - auth_network

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: resume_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      HTTP_ADDR: ":8000"
      REDIS_URL: redis://redis:6379/0
      USER_SERVICE_URL: http://user_service:8000
      GATEWAY_CONFIG: /etc/auth/gateway.yaml
      # Owl chat. LLM_API_KEY and LLM_MODEL come from ../.env.
      LLM_HOST: ${LLM_HOST}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT}
    volumes:
      - ./gateway.yaml:/etc/auth/gateway.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - auth_network
      - user_network
      # The owl chat calls litellm-proxy-server directly, not through the edge.
      - llm_network

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: gateway
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GATEWAY_HTTP_ADDR: ":8083"
      USER_SERVICE_URL: http://user_service:8000
      GATEWAY_CONFIG: /etc/auth/gateway.yaml
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./gateway.yaml:/etc/auth/gateway.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - auth_network
      - user_network
      - llm_network
      # image.filenkov.store upstream http://qwen-image:8000.
      - qwen_image_gen_network
      # rag.filenkov.store upstream http://rag-edge:8080.
      - rag_edge

networks:
  auth_network:
    driver: bridge
  user_network:
    external: true
  llm_network:
    external: true
  qwen_image_gen_network:
    external: true
  rag_edge:
    external: true
